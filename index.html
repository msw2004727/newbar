<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F0E4D2">
<title>小小繪本書架</title>
<meta name="description" content="會說故事的 HTML 幼兒互動繪本，每一本都能按下播放鍵聽朗讀。">
<style>
:root{--paper:#FBF4E6;--bg:#F0E4D2;--ink:#5E4B3C;--ink-soft:#8A7259;--accent:#E8907F;--accent-dark:#D6705E;
  --gold:#F7D678;--line:#EADCC4;--card-shadow:0 4px 16px rgba(120,90,60,.13);--card-shadow-hi:0 10px 26px rgba(120,90,60,.22)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei","Heiti TC",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5;
  background-image:radial-gradient(circle,#E2D2B8 1.4px,transparent 1.5px);background-size:22px 22px}
.wrap{position:relative;z-index:1;max-width:430px;margin:0 auto;padding:0 14px 40px}
.hero{padding:28px 4px 16px;text-align:center}
.hero .mark{width:80px;height:80px;margin:0 auto 10px;display:block}
.hero h1{font-size:27px;margin:0;letter-spacing:3px;font-weight:800}
.hero .en{font-size:10px;letter-spacing:2.5px;color:var(--ink-soft);margin-top:5px;font-weight:600}
.hero p{font-size:13px;line-height:1.9;color:var(--ink-soft);margin:12px 6px 0}
.hero .count{display:inline-block;margin-top:12px;font-size:11px;font-weight:700;background:var(--paper);
  color:var(--ink-soft);padding:5px 14px;border-radius:99px;box-shadow:var(--card-shadow)}
.filters{display:flex;gap:7px;overflow-x:auto;padding:16px 4px 14px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.filters::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:none;cursor:pointer;font-family:inherit;font-weight:700;font-size:12.5px;
  padding:8px 15px;border-radius:99px;background:var(--paper);color:var(--ink-soft);
  box-shadow:0 2px 6px rgba(120,90,60,.1);transition:background .2s,color .2s,transform .12s}
.chip:active{transform:scale(.94)}
.chip.on{background:var(--accent);color:#fff;box-shadow:0 4px 12px rgba(214,112,94,.35)}
.grid{display:flex;flex-direction:column;gap:18px}
.card{display:block;text-decoration:none;color:inherit;background:var(--paper);border-radius:22px;overflow:hidden;
  box-shadow:var(--card-shadow);transition:transform .22s cubic-bezier(.2,.8,.3,1),box-shadow .22s;animation:pop .45s backwards}
@keyframes pop{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.card:active{transform:scale(.985)}
@media (hover:hover){.card:hover{transform:translateY(-5px);box-shadow:var(--card-shadow-hi)}}
.cover{position:relative;background:#DCEAF2;line-height:0}
.cover svg,.cover img{width:100%;height:auto;display:block;aspect-ratio:4/3;object-fit:cover}
.badge-age{position:absolute;right:11px;top:11px;background:rgba(251,244,230,.94);color:var(--ink);
  font-size:11px;font-weight:800;letter-spacing:.5px;padding:5px 11px;border-radius:99px;box-shadow:0 2px 8px rgba(0,0,0,.14)}
.badge-audio{position:absolute;left:11px;bottom:11px;background:rgba(94,75,60,.72);color:#FBF4E6;
  font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:99px;backdrop-filter:blur(4px)}
.body{padding:15px 16px 17px}
.body h2{font-size:19px;margin:0;letter-spacing:1.2px;font-weight:800}
.body .en2{font-size:9.5px;letter-spacing:1.6px;color:var(--ink-soft);margin-top:4px;font-weight:600}
.body p{font-size:13.5px;line-height:1.85;color:#6E5F4F;margin:9px 0 0}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.tag{font-size:11px;font-weight:700;padding:4px 10px;border-radius:99px;background:#F3E7D0;color:#9A8468}
.tag.t0{background:#FBE0D6;color:#C4704F}.tag.t1{background:#E2EEDA;color:#5C8A50}.tag.t2{background:#DEE9F5;color:#5A7A9E}
.meta{display:flex;align-items:center;gap:8px;margin-top:13px;padding-top:11px;border-top:1px dashed var(--line);
  font-size:11.5px;color:var(--ink-soft);font-weight:600}
.meta .go{margin-left:auto;color:var(--accent-dark);font-weight:800}
.card.soon{background:transparent;box-shadow:none;border:2px dashed #D8C6AC;cursor:default}
.card.soon:hover{transform:none;box-shadow:none}
.soon-in{padding:30px 20px;text-align:center;color:var(--ink-soft)}
.soon-in .ico{font-size:30px;display:block;margin-bottom:8px}
.soon-in b{display:block;font-size:14.5px;color:#8A7A66;margin-bottom:5px}
.soon-in span{font-size:12px;line-height:1.8}
.empty{text-align:center;color:var(--ink-soft);font-size:13px;padding:40px 10px}
footer{text-align:center;color:var(--ink-soft);font-size:11px;line-height:2;margin-top:34px}
@media (min-width:720px){
  .wrap{max-width:1080px;padding:0 26px 56px}
  .hero{padding:44px 0 8px}.hero .mark{width:100px;height:100px}
  .hero h1{font-size:38px;letter-spacing:5px}.hero p{font-size:14.5px}
  .filters{justify-content:center;padding:22px 0 20px;flex-wrap:wrap;overflow:visible}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:24px}
  .body h2{font-size:20px}
}
</style>
</head>

BOOKS[3].cover='<img src="books/fox-sorry/images/cover.webp" alt="" aria-hidden="true" loading="lazy" decoding="async">';
const $=id=>document.getElementById(id);
let active='全部';
function card(b,i){
  return `<a class="card" href="${b.href}" style="animation-delay:${i*60}ms">
    <div class="cover">${b.cover}
      <span class="badge-age">${b.age}</span><span class="badge-audio">🔊 語音朗讀</span></div>
    <div class="body"><h2>${b.title}</h2><div class="en2">${b.en}</div><p>${b.desc}</p>
      <div class="tags">${b.tags.map((t,k)=>`<span class="tag t${k%3}">#${t}</span>`).join('')}</div>
      <div class="meta"><span>📖 ${b.pages} 頁</span><span>・</span><span>⏱ 約 ${b.mins} 分鐘</span>
        <span class="go">開始閱讀 ›</span></div></div></a>`;
}
const soonCard=`<div class="card soon"><div class="soon-in"><span class="ico">🌱</span>
  <b>更多繪本製作中</b><span>下一本正在畫封面、寫故事⋯⋯</span></div></div>`;
function render(){
  const list=active==='全部'?BOOKS:BOOKS.filter(b=>b.tags.includes(active));
  $('grid').innerHTML=list.length
    ? list.map(card).join('')+(active==='全部'?soonCard:'')
    : `<div class="empty">這個標籤下還沒有繪本 🐾</div>`;
}
function buildFilters(){
  const tags=['全部',...MAIN_TAGS];
  $('filters').innerHTML=tags.map(t=>`<button class="chip ${t===active?'on':''}" data-t="${t}">${t==='全部'?'全部':'#'+t}</button>`).join('');
  $('filters').querySelectorAll('.chip').forEach(c=>c.onclick=()=>{
    active=c.dataset.t;
    $('filters').querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x.dataset.t===active));
    render();
  });
}
$('count').textContent=`目前 ${BOOKS.length} 本繪本 ・ 持續增加中`;
buildFilters(); render();
