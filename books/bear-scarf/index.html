<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#F0E4D2">
<title>熊媽媽的圍巾</title>
<style>
:root{
  --paper:#FBF4E6; --ink:#5E4B3C; --ink-soft:#8A7259; --accent:#E8907F; --accent-dark:#D6705E;
  --gold:#F7D678; --line:#EADCC4; --hl:#FBE7B4; --shadow:0 8px 28px rgba(120,90,60,.16);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:#F0E4D2;color:var(--ink);
  font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei","Heiti TC",system-ui,-apple-system,sans-serif;
  overflow:hidden;display:flex;justify-content:center}
.book{width:100%;max-width:430px;height:100dvh;height:100vh;display:flex;flex-direction:column;
  background:var(--paper);padding:calc(env(safe-area-inset-top) + 6px) 12px calc(env(safe-area-inset-bottom) + 8px);
  box-shadow:var(--shadow);position:relative;overflow:hidden}
.head{display:flex;align-items:center;gap:8px;flex:0 0 auto;padding:0 2px 6px}
.back{width:30px;height:30px;flex:0 0 auto;border-radius:99px;background:#F3E7D0;color:var(--ink-soft);
  text-decoration:none;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:800;line-height:1;padding-bottom:2px}
.back[hidden]{display:none}
.title{font-size:15px;font-weight:800;letter-spacing:.5px}
.title small{display:block;font-size:9.5px;font-weight:500;color:var(--ink-soft);letter-spacing:1px}
.src-badge{margin-left:auto;font-size:10px;padding:3px 8px;border-radius:99px;background:#EFE3CE;color:var(--ink-soft);white-space:nowrap}
.src-badge.mp3{background:#D9EDD4;color:#4A7A46}
.src-badge.tts{background:#FBE3C8;color:#B5713A}
.stage{flex:0 0 auto;width:100%;border-radius:18px;overflow:hidden;background:#DCEAF2;
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.6),0 3px 10px rgba(120,90,60,.12);position:relative}
.stage .story-image{display:block;width:100%;height:auto;aspect-ratio:4/3;object-fit:cover}
.pagetag{position:absolute;left:10px;top:8px;background:rgba(255,255,255,.85);color:var(--ink-soft);
  font-size:10px;font-weight:700;letter-spacing:1px;padding:2px 9px;border-radius:99px}
.panel{flex:1 1 auto;min-height:0;overflow-y:auto;padding:12px 4px 4px;-webkit-overflow-scrolling:touch}
.line{font-size:18px;line-height:1.95;letter-spacing:.6px;padding:5px 10px;margin:2px 0;border-radius:12px;
  transition:background .25s,color .25s,transform .25s;cursor:pointer}
.line .role{display:inline-block;font-size:10px;font-weight:700;color:var(--ink-soft);background:#F1E5CF;
  padding:1px 7px;border-radius:99px;margin-right:6px;vertical-align:2px}
.line.c1 .role{background:#F9DDE0;color:#B26E7C}
.line.c2 .role{background:#DCE9F3;color:#5F7FA3}
.line.c3 .role{background:#E2EEDA;color:#5F8452}
.line.active{background:var(--hl);transform:translateX(3px)}
.line.done{color:var(--ink-soft)}
.controls{flex:0 0 auto;padding-top:6px;border-top:1px solid var(--line)}
.row{display:flex;align-items:center;justify-content:center;gap:10px}
.row.top{margin-bottom:8px}
button{font-family:inherit;border:none;cursor:pointer;color:var(--ink);background:#F3E7D0;border-radius:99px;
  display:flex;align-items:center;justify-content:center;transition:transform .12s,background .2s;font-weight:700}
button:active{transform:scale(.92)}
button:disabled{opacity:.35;cursor:default}
.nav{width:46px;height:46px;font-size:20px;flex:0 0 auto}
.play{width:66px;height:66px;font-size:26px;flex:0 0 auto;background:linear-gradient(160deg,var(--accent),var(--accent-dark));
  color:#fff;box-shadow:0 6px 16px rgba(214,112,94,.4)}
.play.playing{background:linear-gradient(160deg,var(--gold),#E5B94A);box-shadow:0 6px 16px rgba(229,185,74,.4)}
.mini{height:30px;padding:0 12px;font-size:11.5px;background:#F3E7D0;color:var(--ink-soft)}
.mini.on{background:var(--gold);color:#5C4520}
.dots{display:flex;gap:4px;justify-content:center;padding:8px 0 2px;flex-wrap:wrap}
.dot{width:6px;height:6px;border-radius:99px;background:var(--line);transition:all .25s}
.dot.on{background:var(--accent);width:16px}
.speed{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink-soft)}
input[type=range]{width:74px;accent-color:var(--accent)}
.cover{position:absolute;inset:0;z-index:20;background:var(--paper);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;transition:opacity .5s,visibility .5s}
.cover.hide{opacity:0;visibility:hidden}
.cover h1{font-size:30px;margin:0;letter-spacing:3px}
.cover p{margin:0;color:var(--ink-soft);font-size:13px;line-height:1.9}
.cover .art{width:100%;max-width:280px}
.cover .art .cover-art{width:100%;height:auto;aspect-ratio:4/3;object-fit:cover;border-radius:16px;display:block}
.cover .art svg{display:none}
.cover button{background:linear-gradient(160deg,var(--accent),var(--accent-dark));color:#fff;padding:14px 34px;
  border-radius:99px;font-size:16px;height:auto;box-shadow:0 6px 18px rgba(214,112,94,.35)}
@media (min-width:900px) and (min-height:520px){
  .book{max-width:1040px;height:min(680px,100dvh);margin:auto;border-radius:26px;padding:22px 26px;
    display:grid;grid-template-columns:1.15fr 1fr;grid-template-rows:auto 1fr auto;column-gap:26px}
  .head{grid-column:1/3}.stage{grid-row:2/4;align-self:center}
  .panel{grid-row:2/3;padding:0 4px;display:flex;flex-direction:column;justify-content:center}
  .controls{grid-row:3/4;border-top:none}.line{font-size:20px;line-height:2.05}
  .cover .art{max-width:420px}.cover h1{font-size:38px}
}
@media (max-width:400px){.line{font-size:17px;line-height:1.88;padding:4px 9px}.panel{padding-top:9px}}
@media (max-height:640px){.line{font-size:16.5px;line-height:1.85}.play{width:58px;height:58px;font-size:23px}.nav{width:42px;height:42px}}
</style>
</head>

    <h1>熊媽媽的圍巾</h1>
    <p>小熊呼呼有一條媽媽織的長圍巾。<br>有一天圍巾在森林裡不見了，他不敢回家——直到媽媽張開手臂說：媽媽的手還在呀。<br><span style="font-size:11px;opacity:.75">適讀 3-5 歲 ・ 全 12 頁 ・ 約 4 分鐘</span></p>
    <button id="btnStart">▶ 開始聽故事</button>

<script>
const LINES = [[{"role": "旁白", "text": "小熊呼呼有一條圍巾，是媽媽一針一針織的。", "emo": "溫柔敘述，像睡前", "rate": 0.84, "pitch": 1.0, "gap": 560}, {"role": "旁白", "text": "圍巾好長好長，可以繞三圈。", "emo": "帶著笑意，「好長好長」拉長", "rate": 0.8, "pitch": 1.04, "gap": 680}], [{"role": "旁白", "text": "只要圍上它，呼呼就什麼都不怕。", "emo": "明亮輕快", "rate": 0.88, "pitch": 1.05, "gap": 520}, {"role": "呼呼", "text": "「今天我要去很遠很遠的地方！」", "emo": "興奮、音調高", "rate": 0.96, "pitch": 1.18, "gap": 640}], [{"role": "旁白", "text": "每天早上，媽媽都幫他圍好才出門。", "emo": "平穩溫柔", "rate": 0.84, "pitch": 1.0, "gap": 500}, {"role": "媽媽", "text": "「繞緊一點，這樣媽媽的手就一直在你身上。」", "emo": "非常輕柔，句尾放軟", "rate": 0.78, "pitch": 1.02, "gap": 700}], [{"role": "旁白", "text": "那天下午，呼呼在森林裡追蝴蝶。", "emo": "輕快", "rate": 0.9, "pitch": 1.06, "gap": 480}, {"role": "旁白", "text": "追著追著，圍巾從脖子上滑下來了。", "emo": "語氣一沉", "rate": 0.82, "pitch": 0.98, "gap": 620}], [{"role": "旁白", "text": "回到家門口，呼呼摸摸脖子——", "emo": "停頓感，句尾懸著", "rate": 0.82, "pitch": 1.0, "gap": 560}, {"role": "呼呼", "text": "「圍巾呢？」", "emo": "驚慌，音調突然拉高", "rate": 1.0, "pitch": 1.24, "gap": 700}], [{"role": "旁白", "text": "他找遍了草叢，找遍了樹下。", "emo": "急切", "rate": 0.92, "pitch": 1.04, "gap": 460}, {"role": "旁白", "text": "小河邊也找了，石頭後面也找了。", "emo": "急切漸弱", "rate": 0.88, "pitch": 1.0, "gap": 520}, {"role": "旁白", "text": "圍巾不見了。", "emo": "四個字，慢，沉下去", "rate": 0.66, "pitch": 0.94, "gap": 780}], [{"role": "旁白", "text": "天慢慢黑了。", "emo": "低沉", "rate": 0.74, "pitch": 0.94, "gap": 560}, {"role": "旁白", "text": "呼呼蹲在路邊，一直不敢回家。", "emo": "難過，聲音變小", "rate": 0.76, "pitch": 0.96, "gap": 640}, {"role": "呼呼", "text": "「媽媽會不會⋯⋯生氣？」", "emo": "哽咽，中間停一拍", "rate": 0.7, "pitch": 1.14, "gap": 820}], [{"role": "旁白", "text": "門口的燈亮著。", "emo": "溫暖、放慢", "rate": 0.78, "pitch": 1.0, "gap": 520}, {"role": "旁白", "text": "媽媽站在那裡，張開了手。", "emo": "溫暖", "rate": 0.8, "pitch": 1.0, "gap": 700}], [{"role": "呼呼", "text": "「圍巾⋯⋯我把圍巾弄丟了。」", "emo": "抽噎、斷斷續續", "rate": 0.68, "pitch": 1.12, "gap": 700}, {"role": "旁白", "text": "媽媽沒有生氣。她把呼呼抱得好緊好緊。", "emo": "極溫柔", "rate": 0.76, "pitch": 1.0, "gap": 640}, {"role": "媽媽", "text": "「圍巾丟了沒關係，媽媽的手還在呀。」", "emo": "溫柔而堅定", "rate": 0.74, "pitch": 1.02, "gap": 880}], [{"role": "旁白", "text": "那天晚上，媽媽又拿出了毛線。", "emo": "安靜溫暖", "rate": 0.8, "pitch": 1.0, "gap": 520}, {"role": "旁白", "text": "呼呼靠在旁邊，看著媽媽一針、一針。", "emo": "很慢，有節奏感", "rate": 0.7, "pitch": 1.0, "gap": 720}], [{"role": "旁白", "text": "織著織著，呼呼睡著了。", "emo": "越說越輕", "rate": 0.72, "pitch": 1.0, "gap": 560}, {"role": "旁白", "text": "夢裡好像有一條，長長長長的圍巾。", "emo": "氣音、耳語", "rate": 0.68, "pitch": 1.02, "gap": 800}], [{"role": "旁白", "text": "新的圍巾織好了，比以前更長。", "emo": "明亮", "rate": 0.86, "pitch": 1.05, "gap": 500}, {"role": "旁白", "text": "長到可以繞四圈——", "emo": "留白，句尾懸著", "rate": 0.8, "pitch": 1.06, "gap": 460}, {"role": "呼呼", "text": "「這一圈，是給媽媽的。」", "emo": "驕傲又甜，句尾上揚", "rate": 0.88, "pitch": 1.18, "gap": 1000}]];

const ROLECLS = {"呼呼": "c1", "媽媽": "c2"};

const $=id=>document.getElementById(id);
let page=0, playing=false, token=0, autoPage=false, globalRate=.95, curAudio=null;
const audioCache=new Map();

function probeAudio(src){
  if(audioCache.has(src)) return audioCache.get(src);
  const p=new Promise(res=>{
    const a=new Audio(); let done=false;
    const ok=()=>{if(!done){done=true;res(a);}}, bad=()=>{if(!done){done=true;res(null);}};
    a.addEventListener('canplaythrough',ok,{once:true});
    a.addEventListener('loadedmetadata',ok,{once:true});
    a.addEventListener('error',bad,{once:true});
    a.preload='auto'; a.src=src; a.load(); setTimeout(bad,1800);
  });
  audioCache.set(src,p); return p;
}
let voice=null;
function pickVoice(){
  const vs=speechSynthesis.getVoices(); if(!vs.length) return null;
  return vs.find(v=>/zh[-_]TW/i.test(v.lang)&&/Google|Meijia|美嘉/i.test(v.name))
      || vs.find(v=>/zh[-_]TW/i.test(v.lang)) || vs.find(v=>/zh[-_]HK/i.test(v.lang))
      || vs.find(v=>/^zh/i.test(v.lang)) || null;
}
if('speechSynthesis' in window){ speechSynthesis.onvoiceschanged=()=>{voice=pickVoice();}; voice=pickVoice(); }
function speak(line){
  return new Promise(res=>{
    const est=line.text.length*300+1500;
    if(!('speechSynthesis' in window)) return setTimeout(res,Math.min(est,4000));
    let done=false; const fin=()=>{if(!done){done=true;res();}};
    const u=new SpeechSynthesisUtterance(line.text.replace(/[「」『』—…⋯]/g,'，').replace(/，+/g,'，'));
    u.lang='zh-TW'; if(voice) u.voice=voice;
    u.rate=Math.max(.5,Math.min(2,line.rate*globalRate/0.95)); u.pitch=line.pitch;
    u.onend=fin; u.onerror=fin;
    speechSynthesis.speak(u); setTimeout(fin,est/Math.max(.6,globalRate));
  });
}
function playAudioEl(a){
  return new Promise(res=>{ curAudio=a; a.currentTime=0;
    a.playbackRate=Math.max(.5,Math.min(2,globalRate/0.95)); a.onended=res; a.onerror=res;
    a.play().catch(res); });
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function setBadge(k){
  const b=$('srcBadge');
  b.className='src-badge '+(k==='mp3'?'mp3':k==='tts'?'tts':'');
  b.textContent=k==='mp3'?'🎧 配音檔':k==='tts'?'🤖 瀏覽器語音':'尚未播放';
}
async function playPage(from=0){
  const my=++token; playing=true; updatePlayBtn();
  const lines=LINES[page];
  for(let i=from;i<lines.length;i++){
    if(my!==token) return;
    highlight(i);
    const a=await probeAudio(`audio/p${page+1}-${i+1}.mp3`);
    if(my!==token) return;
    setBadge(a?'mp3':'tts');
    if(a) await playAudioEl(a); else await speak(lines[i]);
    if(my!==token) return;
    await sleep(lines[i].gap*(1/Math.max(.6,globalRate)));
    if(my!==token) return;
    markDone(i);
  }
  highlight(-1); playing=false; updatePlayBtn();
  if(autoPage && page<LINES.length-1){ await sleep(600); if(my===token){ go(page+1); playPage(); } }
}
function stopAll(){
  token++; playing=false;
  if('speechSynthesis' in window) speechSynthesis.cancel();
  if(curAudio){ curAudio.pause(); curAudio=null; }
  highlight(-1); updatePlayBtn();
}
function highlight(i){
  document.querySelectorAll('.line').forEach((el,k)=>el.classList.toggle('active',k===i));
  const el=document.querySelectorAll('.line')[i];
  if(el) el.scrollIntoView({block:'nearest',behavior:'smooth'});
}
function markDone(i){ const el=document.querySelectorAll('.line')[i]; if(el){el.classList.remove('active');el.classList.add('done');} }
function updatePlayBtn(){ const b=$('btnPlay'); b.textContent=playing?'⏸':'▶'; b.classList.toggle('playing',playing); }
function render(){
  const scene=document.createElement('img');
  scene.className='story-image';
  scene.src=`images/page-${String(page+1).padStart(2,'0')}.webp`;
  scene.alt=`《熊媽媽的圍巾》第 ${page+1} 頁插畫：${LINES[page].join('')}`;
  scene.decoding='async';
  $('art').replaceChildren(scene);
  $('pagetag').textContent=`${page+1} / ${LINES.length}`;
  $('panel').innerHTML=LINES[page].map((l,i)=>{
    const tag=l.role==='旁白'?'':`<span class="role">${l.role}</span>`;
    return `<div class="line ${ROLECLS[l.role]||''}" data-i="${i}" title="${l.emo}">${tag}${l.text}</div>`;
  }).join('');
  $('panel').querySelectorAll('.line').forEach(el=>{ el.onclick=()=>{ stopAll(); playPage(+el.dataset.i); }; });
  $('dots').innerHTML=LINES.map((_,i)=>`<div class="dot ${i===page?'on':''}"></div>`).join('');
  $('btnPrev').disabled=page===0; $('btnNext').disabled=page===LINES.length-1;
  $('panel').scrollTop=0;
}
function go(p){ if(p<0||p>=LINES.length) return; stopAll(); page=p; render(); }
$('btnPlay').onclick=()=>{ playing?stopAll():playPage(); };
$('btnPrev').onclick=()=>go(page-1);
$('btnNext').onclick=()=>go(page+1);
$('btnAuto').onclick=e=>{ autoPage=!autoPage; e.currentTarget.classList.toggle('on',autoPage); };
$('speed').oninput=e=>{ globalRate=+e.target.value; };
$('btnStart').onclick=()=>{
  $('coverEl').classList.add('hide');
  if('speechSynthesis' in window){ speechSynthesis.cancel(); voice=pickVoice();
    const w=new SpeechSynthesisUtterance(' '); w.volume=0; speechSynthesis.speak(w); }
  setTimeout(()=>playPage(),420);
};
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight') go(page+1);
  if(e.key==='ArrowLeft') go(page-1);
  if(e.key===' '){ e.preventDefault(); playing?stopAll():playPage(); }
});
let tx=0,ty=0;
document.querySelector('.stage').addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;},{passive:true});
document.querySelector('.stage').addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)) go(page+(dx<0?1:-1));
},{passive:true});
if(/\/books\//.test(location.pathname)) $('back').hidden=false;
render();
</script>
</body>
</html>
